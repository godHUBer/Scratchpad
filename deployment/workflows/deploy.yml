name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required by actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight deployment; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify
        run: |
          npm run lint
          npm run typecheck
          npm test

      # Repository Variables are OPTIONAL. If they are unset, ${{ vars.X }}
      # expands to an empty string, and Vite would inline "" over the working
      # values in .env.production. So only export the ones that actually have a
      # value; .env.production supplies the rest.
      - name: Resolve optional config overrides
        id: cfg
        env:
          VAR_URL: ${{ vars.VITE_SUPABASE_URL }}
          VAR_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$VAR_URL" ]; then
            echo "VITE_SUPABASE_URL=$VAR_URL" >> "$GITHUB_ENV"
            echo "using repository variable for VITE_SUPABASE_URL"
          else
            echo "no repository variable for VITE_SUPABASE_URL; using .env.production"
          fi
          if [ -n "$VAR_KEY" ]; then
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$VAR_KEY" >> "$GITHUB_ENV"
            echo "using repository variable for VITE_SUPABASE_PUBLISHABLE_KEY"
          else
            echo "no repository variable for VITE_SUPABASE_PUBLISHABLE_KEY; using .env.production"
          fi

      - name: Build
        run: npm run build
        env:
          # Project sites live under /<repo>/, user sites under /.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      # A build with an empty VITE_SUPABASE_URL renders a "not configured"
      # screen instead of the app. Catch that here rather than in the browser.
      - name: Verify bundle has configuration baked in
        # The host used to be hard-coded here. Once a fork or an owner set their
        # own VITE_SUPABASE_URL repository variable, the build was correct but
        # this step still grepped for the original project's host and failed the
        # deploy. Derive it from the same source of truth the build used.
        env:
          EXPECTED_URL: ${{ vars.VITE_SUPABASE_URL }}
        run: |
          if [ -n "$EXPECTED_URL" ]; then
            host=$(printf '%s' "$EXPECTED_URL" | sed -E 's#^https?://##; s#/+$##')
          else
            host=$(grep -E '^VITE_SUPABASE_URL=' .env.production | head -1 | cut -d= -f2- | sed -E 's#^https?://##; s#/+$##')
          fi
          if [ -z "$host" ]; then
            echo "::error::No Supabase URL found in the environment or .env.production."
            exit 1
          fi
          echo "expecting host: $host"
          if ! grep -rqF "$host" dist/assets/*.js; then
            echo "::error::The built bundle does not contain $host. Check .env.production / repository variables."
            exit 1
          fi
          if ! grep -rqE 'sb_publishable_|eyJhbGciOi' dist/assets/*.js; then
            echo "::error::No publishable key found in the built bundle."
            exit 1
          fi
          echo "configuration present in bundle"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
