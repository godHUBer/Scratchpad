name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required by actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight deployment; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify
        run: |
          npm run lint
          npm run typecheck
          npm test

      # Repository Variables are OPTIONAL. If they are unset, ${{ vars.X }}
      # expands to an empty string, and Vite would inline "" over the working
      # values in .env.production. So only export the ones that actually have a
      # value; .env.production supplies the rest.
      - name: Resolve optional config overrides
        id: cfg
        env:
          VAR_URL: ${{ vars.VITE_SUPABASE_URL }}
          VAR_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$VAR_URL" ]; then
            echo "VITE_SUPABASE_URL=$VAR_URL" >> "$GITHUB_ENV"
            echo "using repository variable for VITE_SUPABASE_URL"
          else
            echo "no repository variable for VITE_SUPABASE_URL; using .env.production"
          fi
          if [ -n "$VAR_KEY" ]; then
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$VAR_KEY" >> "$GITHUB_ENV"
            echo "using repository variable for VITE_SUPABASE_PUBLISHABLE_KEY"
          else
            echo "no repository variable for VITE_SUPABASE_PUBLISHABLE_KEY; using .env.production"
          fi

      - name: Build
        run: npm run build
        env:
          # Project sites live under /<repo>/, user sites under /.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      # A build with an empty VITE_SUPABASE_URL renders a "not configured"
      # screen instead of the app. Catch that here rather than in the browser.
      - name: Verify bundle has configuration baked in
        run: |
          echo "dist/index.html:"
          cat dist/index.html
          if ! grep -rq "lkxygnbvkdlwacbcbott.supabase.co" dist/assets/*.js; then
            echo "::error::No Supabase URL found in the built bundle. Check .env.production / repository variables."
            exit 1
          fi
          echo "configuration present in bundle"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
